      '++LotusScript Development Environment:2:5:(Options):0:66
      
      '++LotusScript Development Environment:2:5:(Forward):0:1
      Declare Sub Initialize
      
      '++LotusScript Development Environment:2:5:(Declarations):0:2
      
      '++LotusScript Development Environment:2:2:BindEvents:1:129
      Private Sub BindEvents(Byval Objectname_ As String)
           Static Source As FIELD
           Set Source = Bind(Objectname_)
      End Sub
      
      '++LotusScript Development Environment:2:2:Initialize:1:10
      Sub Initialize
                     'THIS SCRIPT IS ACTUALLY DOING A HIDE WHEN MOMENTARILY AS OF 7/20 PM - FIGURE OUT HOW TO KEEP IT.     
           Dim s As New NotesSession
           Dim db As NotesDatabase
           Dim w As New NotesUIWorkspace
           Dim uidoc As NotesUIDocument
           Dim doc As NotesDocument
           Set db=s.CurrentDatabase
           Set uidoc = w.currentdocument
           Set doc = uidoc.document
                     '____________________________________________________________________________________________
                    'Here's some possible specific author stuff to work on for later.
                         'Set doc = view.GetDocumentByKey( "DocAuthor", s.UserName )
                         'We never yet saved a document in the Search User State folder, so here we need to make a new variable that reflects back end of uidoc. ---------
           Dim searchFlowCurrent As String
           Dim searchFlowitem As NotesItem
           
           searchFlowCurrent="Start Search"
                REM NOT WORKING searchflowitem = doc.SetItemValue( "SearchFlow" )
                REM NOT WORKING doc.SearchFlow(0)=searchFlowCurrent
           doc.searchFlow=searchflowCurrent
           'According to the debugger this line above is NOT setting a field to "Start Search" but creating a text item with that value?
           'However there's also this value in the item
                REM doc.SearchFlow(0)=searchflowCurrent
           'Messagebox("The next message shows the value of SearchFlow in doc right after we set the global variable and then set SearchFlow equal to it.")
           'Messagebox( doc.SearchFlow( 0 ) )
           'According to the debugger this uidoc referesh is actually wiping out the value we want.
           'uidoc.Refresh
           'uidoc.RefreshHideFormulas
           'Messagebox ("The next message shows the value of SearchFlow after uidoc is refreshed BEFORE THE SAVE.")
           'Dim searchflowContents As Variant
           'searchflowContents = doc.GetItemValue( "SearchFlow" )     
           'Messagebox( searchflowContents( 0 ) )
           'Call doc.Save( True, True )
                REM Messagebox("Wendi says SearchFlow field = " + doc.SearchFlow) -- This is Wendi's line, still no word on why it isn't showing.
                'These 3 lines are in here to see whether the save worked, so I don't have to open the doc each time to check - but the message isn't appearing??
           'Messagebox ("The next message shows the value of SearchFlow after doc is saved.")
           'Messagebox( searchflowContents( 0 ) )
           'uidoc.AutoReload = True
           'uidoc.Reload
           'Messagebox ("The next message shows the value of SearchFlow after uidoc is reloaded.")
           'Messagebox( searchflowContents( 0 ) )
           'uidoc.Refresh
           'Messagebox ("The next message shows the value of SearchFlow after uidoc is refreshed.")
           'Messagebox( searchflowContents( 0 ) )
           'uidoc.RefreshHideFormulas
           'Messagebox ("The next message shows the value of SearchFlow after uidoc hide formulas are refreshed.")
           'Messagebox( searchflowContents( 0 ) )
                'END of Susanna's stuff________
      End Sub
