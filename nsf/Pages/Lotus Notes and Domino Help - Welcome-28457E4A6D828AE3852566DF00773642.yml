        data: |
          '++LotusScript Development Environment:2:5:(Options):0:66
          
          '++LotusScript Development Environment:2:5:(Forward):0:1
          Declare Sub Click(Source As Button)
          
          '++LotusScript Development Environment:2:5:(Declarations):0:2
          
          '++LotusScript Development Environment:2:2:BindEvents:1:129
          Private Sub BindEvents(Byval Objectname_ As String)
          	Static Source As BUTTON
          	Set Source = Bind(Objectname_)
          	On Event Click From Source Call Click
          End Sub
          
          '++LotusScript Development Environment:2:2:Click:1:12
          Sub Click(Source As Button)
          	Dim s As New NotesSession
          	Dim ws As New NotesUIWorkspace
          	Dim db As NotesDatabase
          	Set db = s.CurrentDatabase
          	Dim view As NotesView
          	Dim doc As NotesDocument
          	Set view = db.GetView("(Help)")
          	Set doc = view.GetFirstDocument
          	While Not (doc Is Nothing)
          		Dim item As NotesItem
          		Set item = doc.GetFirstItem("AppSpecID")
          		If item.Text = "using_help" Then
          			Dim unid As String
          			unid = doc.UniversalID
          			Set doc = db.GetDocumentByUNID(unid$)
          			Call ws.SetTargetFrame("Topic")
          			Call ws.EditDocument(False, doc, True,,False)
          		Else
          		End If
          		Set doc = view.GetNextDocument(doc)
          	Wend
          End Sub
        title: Get Help on Help
